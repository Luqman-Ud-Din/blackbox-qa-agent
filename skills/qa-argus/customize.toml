# argus-qa run defaults  override automation.config.json values for this run
# Changes here affect ALL future runs from this project.

dry_run     = false         # false = file real ADO bugs (plugin default). Set true to detect-only.
browsers    = ["chromium", "firefox", "webkit"]

#    Model routing
# Default model for every skill not listed in [models]. Haiku is cheapest and
# sufficient for mechanical detection / functional checks. Overrides below.
[models]
default                = "haiku"
"qa-route-discovery"   = "sonnet"   # SPA navigation judgment
"qa-test-auth-flow"    = "sonnet"   # multi-step login + error handling
"qa-test-cases"        = "sonnet"   # natural-language step interpretation
"qa-bug-filer"         = "sonnet"   # readable ADO bug descriptions
"qa-review-content"    = "sonnet"   # spelling, grammar, word choice, content quality
"qa-review-hidden-text" = "sonnet"  # spelling/grammar in placeholders, alt, title, aria-label, options
# Vision review only fires when vision_review = true (below). Then Opus is used.
vision_model           = "sonnet"

# Escalation: when a Haiku skill returns { uncertain: true }, the orchestrator
# re-dispatches the same cell on this model. Keep small to control cost.
escalation_model       = "sonnet"

[detectors]
# --- Layout & viewport detectors ---
qa-detect-overflow              = true
qa-detect-typography            = true
qa-detect-typography-advanced   = true
qa-detect-typography-responsive = false   # responsive/legibility gaps: fluid type, justified-hyphens, text-over-image, px sizing, tabular figures   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-touch                 = true
qa-detect-images                = true
qa-detect-layout                = true
qa-detect-a11y                  = true
qa-detect-loading               = true
qa-detect-console-errors        = true
qa-detect-network-errors        = true
qa-detect-reflow                = true
qa-detect-breakpoint-boundary   = true
qa-detect-zoom-200              = true
qa-detect-responsive-images     = false   # DISABLED 2026-06-09: optimization nags (srcset/oversize/retina), not real defects
qa-detect-orientation           = true
qa-detect-dropdown-viewport-clip = true
qa-detect-sticky-scroll         = true
qa-detect-modal-viewport-fit    = true
qa-detect-hover-touch           = false  # DISABLED 2026-06-15: only emits hoverStylesStuckOnTouch, which fires on ~100% of Angular Material apps (Material ships hundreds of bare :hover rules). Pure noise on desktop-first admin tools.
qa-detect-overflow-controls     = true
qa-detect-word-break            = true   # re-enabled 2026-06-05 per user request — overlap with qa-detect-typography is OK; dedup layer handles it
qa-detect-reduced-motion        = true
qa-detect-forced-colors         = false   # DISABLED 2026-06-10: Windows High-Contrast-Mode nags (borderless buttons, colored icons) fire on normal design, not real bugs
qa-detect-viewport-meta         = true
qa-detect-safe-area             = true
qa-detect-rtl-layout            = true
qa-detect-dark-mode             = true
qa-detect-mobile-keyboard       = true
qa-detect-content-patterns      = true   # Layer 1 of grammar 2-layer strategy (deterministic regex/dictionary)

# --- Functional test skills ---
qa-test-navigation              = true
qa-test-mobile-nav              = true
qa-test-auth-flow               = true
qa-test-data-controls           = true
qa-test-widgets                 = true
qa-test-states                  = true
qa-test-history                 = true
qa-test-idempotency             = true
qa-test-keyboard                = true
qa-test-dragdrop                = true
qa-test-i18n                    = true
qa-test-theme                   = true
qa-test-cases                   = true
qa-test-crud                    = true   # full create→edit→delete cycle with cleanup (needs allow_form_submit=true)
# Previously ORPHANED (existed as skills but were not listed here, so the bundler never saw them — wired in 2026-06-11)
qa-test-export                  = true   # export buttons (CSV/PDF/Excel) trigger a download and the file is non-empty
qa-test-filter-accuracy         = true   # after applying a filter, the remaining rows actually match the filter
qa-test-workflow                = true   # multi-step end-to-end workflows (wizard → submit → confirm)
qa-test-permissions             = false  # needs ≥2 user roles/accounts to compare access — enable only when extra creds are configured
qa-test-upload-e2e              = false  # real file upload; creates data on the target — enable only against a sandbox
# qa-vision-review is NOT toggled here — it is gated by `vision_review` below and runs as Step 6 (screenshot vision), not a probe.

# --- Content review skills ---
qa-review-content               = true
qa-review-hidden-text           = true

# --- Consolidated form skills (v2.1.0, 2026-06-03) ---
# These 6 skills replaced 22 overlapping form skills. Each owns a clean boundary.
qa-form-structure               = true   # form/submit/fieldset structure + mobile dimensions
qa-form-a11y                    = true   # labels, ARIA, error announcement, focus order, password toggle
qa-form-validation              = true   # required/format/range/feedback/error-summary + submit-state + special-chars
qa-form-input-types             = true   # date, file, OTP, combobox, tag, mask, formatted, inline-edit, password
qa-form-security                = true   # CSRF, autocomplete, captcha
qa-form-flow                    = true   # multi-step wizard, conditional fields

# --- MCP-powered responsiveness skills (v2.2.0, 2026-06-03) ---
# Each uses Playwright MCP capabilities (browser_resize, browser_evaluate matchMedia,
# fullPage + element screenshots, TouchEvent dispatch, fetch interceptor throttle).
qa-detect-breakpoint-edge       = true   # browser_resize at exact @media boundaries (B-1 vs B+1)
qa-detect-visual-regression     = false  # DISABLED 2026-06-15: DOM brightness-hash diff is unstable on live-data dashboards (counters/timestamps/status colors shift the hash every run → spurious regressions). No static baseline is set up. pHash baseline diff (fullPage + per-component)
qa-detect-orientation-flip      = true   # portrait↔landscape via resize, state-loss detection
qa-detect-adaptive-state        = true   # dark/RM/forced-colors/contrast in one cell via matchMedia
qa-detect-touch-interactions    = true   # real TouchEvent dispatch (hover-only detection)
qa-detect-loading-states        = true   # fetch interceptor throttle + multi-interval snapshot

# --- Responsiveness gap-fills (v2.5.0, 2026-06-04) ---
qa-detect-viewport-parity       = true   # features/columns/actions present on desktop but dropped on mobile/tablet (resize-compare)
qa-detect-fluid-sweep           = true   # overflow at in-between widths (600/900/1100) + extremes (320/1920) — runs once per route
qa-detect-viewport-units        = true   # 100vh-not-dvh (address-bar clip) + retina-blurry images

# --- Performance: Core Web Vitals (v2.3.0, 2026-06-03) ---
# Measures LCP, CLS, INP, TBT, TTFB, FCP via PerformanceObserver injection.
# Same metrics Lighthouse uses, same thresholds Google ranks pages on.
qa-detect-web-vitals            = true   # 6 vitals + long-tasks + DOM-size + main-thread-block

# --- UX detectors (added 2026-06-04) ---
# These cover what the a11y/overflow/touch skills don't: visual symmetry,
# icon UX, action button quality, feedback gaps, spacing consistency, affordance.
# Each is a deterministic browser probe — runs in the batched Haiku call.
qa-detect-ux-symmetry           = false   # left/right padding, card edge mismatch, viewport centering   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-icons              = true   # icon-only buttons w/o tooltip, ambiguous icons, size/duplicates/color-only   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect  # RE-ENABLED 2026-06-09: real defects kept via [keep_issuetypes]
qa-detect-ux-actions            = true   # destructive without confirm, multiple primary CTAs, disabled without explanation   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect  # RE-ENABLED 2026-06-09: real defects kept via [keep_issuetypes]
qa-detect-ux-feedback           = true   # empty states, modal close/ESC, search clear, loading indicators
qa-detect-ux-spacing            = false   # form field gaps, button group gaps, card padding, heading breathing room   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-affordance         = true   # cursor:pointer, link styling, input borders, focus visible, hover-only controls   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect  # RE-ENABLED 2026-06-09: real defects kept via [keep_issuetypes]
qa-detect-ux-table-layout       = true   # header width mismatch (dead space), phantom columns, missing sticky/zebra, empty Actions column   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect  # RE-ENABLED 2026-06-09: real defects kept via [keep_issuetypes]
qa-detect-ux-nav-icons          = false   # sidebar/tab icon-label consistency, icon size/style mix, active-state missing, label truncation   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-theme-consistency  = false   # focus color vs theme primary, link color drift, multiple primary hues, status-color misuse   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-table-data         = true   # excessive empty space, reverse Sr# numbering, all-empty column, sort indicator mix, action btn gap   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect  # RE-ENABLED 2026-06-09: real defects kept via [keep_issuetypes]
qa-detect-ux-modal-form         = true   # modal title plurality, modal not centered, required-asterisk mix, static text mistaken for field   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect  # RE-ENABLED 2026-06-09: real defects kept via [keep_issuetypes]
qa-detect-ux-overlap            = true   # elements physically overlap (toolbar over table header, calendar text crash, sticky covers content)
qa-detect-ux-truncation         = true   # header cut mid-word, cell text clipped to 1 char, button/tab/breadcrumb truncation   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect  # RE-ENABLED 2026-06-09: real defects kept via [keep_issuetypes]
qa-detect-ux-active-state       = false   # mixed active styles in same nav (bg vs color), multiple active items, indicator too subtle   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-breadcrumb         = true   # Students > Students duplicate, missing home, current page is link, separator inconsistency
qa-detect-ux-hover              = false   # button/link/icon no hover state, hover no transition, hover color off theme   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-whitespace         = false   # form uses < 50% width, excessive left/right margin, low viewport occupancy, fields stacked   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-page-header        = false   # page title before breadcrumb home, title duplicated in breadcrumb, home icon mid-path   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-required-state     = true   # required field with red border on load, asterisk-only required, error class no message   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect  # RE-ENABLED 2026-06-09: real defects kept via [keep_issuetypes]
qa-detect-ux-toolbar-consistency = false  # toolbar mixed shadow / size / radius / icon-text style / label casing / border color   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-input-width        = false   # input narrow vs container, fixed width on mobile, sibling width mismatch, textarea single-row   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-pagination         = true   # no page-size selector for large datasets, no total count, page-number overflow, missing first/last   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect  # RE-ENABLED 2026-06-09: real defects kept via [keep_issuetypes]
qa-detect-ux-selected-color-mix = false   # multiple colors used for 'selected/active' indicators in same widget (today vs month vs date all different)   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-card-consistency   = false   # cards on same page mixed border-radius, shadow, border color, width/height; single card with asymmetric padding   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-card-usage         = false   # illogical card usage: single-element card, mostly empty card, deep nesting, missing title, actions not in footer   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-format-consistency = false   # dates, currencies, numbers, phones, times shown in mixed formats on same page   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-media-shape        = false   # avatar shape/size mix, image aspect-ratio variance, decoration mix, logo size drift   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-alignment          = false   # breadcrumb baseline drift, label-input baseline drift, icon-text alignment, sibling height mismatch, table cell vertical-align mixed   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-cross-page-theme   = false   # records per-cell color fingerprints; scripts/check-cross-page-theme.cjs aggregates after the run to flag sidebar/header/theme drift across routes   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-ux-toast-notification = true   # generic toast messages, sentence-fragment toasts, trailing comma, missing role=alert, close-button no label, color-only status badges   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect  # RE-ENABLED 2026-06-09: real defects kept via [keep_issuetypes]
qa-detect-video                 = true   # <video> responsiveness + controls + YouTube/Vimeo iframe wrappers (v2.6.0, 2026-06-04)
qa-detect-css-compat            = false   # cross-browser CSS gaps: missing vendor prefixes, Safari traps, var() no-fallback (v2.6.0, 2026-06-04)   # DISABLED 2026-06-09: cosmetic/opinion noise, not a real defect
qa-detect-hidden-resources      = true   # desktop-only elements hidden on mobile but still downloading images/iframes (v2.6.0, 2026-06-04)
qa-detect-ux-chart-render       = true   # chart shows axes/legend but no data marks, orphan tooltips floating with no active point (Fees & Expenses screenshot)
qa-detect-ux-widget-cramping    = true   # widget title wraps mid-phrase, toolbar buttons overlap title, controls clipped at right edge, header forced onto multiple rows (Calendar widget screenshot)
qa-detect-ux-empty-state-conflict = true # "Record Not Found" toast/message visible while old result cards still showing, pagination shown on empty state, duplicate stacked toasts (Students filter screenshot)

vision_review                   = true

# Vision review scoping
[vision]
# Only run vision on these routes (controls cost)
critical_routes = ["/", "/login"]
# Hard cap on vision-analyzed cells per audit
max_cells = 6

# Grammar / content review scoping  (qa-review-content)
[grammar]
# Leave empty [] to review every route. Add specific routes to limit Sonnet cost.
critical_routes = []
# Hard cap on cells reviewed per audit (legal-mode cells are uncapped — compliance is mandatory)
max_cells = 12
# Cap on visible-text characters sent to Sonnet per cell
max_chars = 5000

# Content audit knobs  (qa-detect-content-patterns + qa-review-content)
# Wired into both Layer 1 probe and Layer 2 Sonnet prompts so the checks are
# scope-aware (multilingual sites, brand-aware false-positive suppression,
# legal-page compliance auto-mode).
[content]
english_only            = true   # skip text inside lang!="en" subtrees (Layer 1 probe)
enable_reading_level    = true   # emit highReadingLevel findings for FK > 12 (Layer 1 probe)
enable_long_sentence    = true   # emit longSentence findings for >30 words (Layer 1 probe)
enable_generic_cta      = true   # flag "Click here"/"Submit"/"Learn more" CTAs (Layer 1 probe)
enable_homophone_grade  = true   # Layer 1 flags candidates; Layer 2 grades correctness
enable_misspelling_confirm = true # Layer 1 extracts candidates; Layer 2 confirms with dictionary
enable_legal_mode       = true   # route-scoped GDPR/CCPA/T&C audit (Layer 2 only)
# Proper-noun whitelist + legal routes live in automation.config.json → content.{proper_nouns, legal_routes}
# so they can be overridden per-app without editing this plugin file.

# Cross-skill deduplication  (added 2026-06-03 — orchestrator Step 5.4 (i.5))
# Eliminates duplicate ADO tickets when multiple skills find the same DOM bug.
# Without this, one broken button can produce 4 tickets. With it, devs see 1.
# Cost: $0 (pure orchestrator logic, no MCP/LLM calls). Impact: -40 to -60% tickets.
[dedup]
enabled                          = true
bbox_grid_px                     = 10      # round coordinates to this grid for "same region" matching
cross_family_at_same_element     = true    # findings on EXACT same selector+bbox merge regardless of family
preserve_dropped_in_description  = true    # append "(also detected by: ...)" to winner.description
track_dedup_count_in_summary     = true    # emit dedupCount totals to run-summary.json

# Custom families — extend the built-in family map. Two findings in the same family
# at the same selector + bbox region merge into one ticket.
# Built-in families: touch_target, labeling, validation, overflow, hierarchy,
# contrast, loading, security, images, typography, motion, breakpoint
# Extend per your custom issue types here:
[dedup.families]
# Example:
# my_custom_family = ["myCustomIssueType1", "myCustomIssueType2"]

# Functional happy-path testing  (added 2026-06-04)
# Negative-path form validation (empty/invalid submit, double-submit, etc.) is ALWAYS safe — it gets
# rejected, creates no data — and always runs. Happy-path submit (fill VALID data → submit → confirm
# success) CREATES REAL RECORDS on the target, so it is OFF by default. Turn on only against a dev/sandbox.
[safe_testing]
allow_form_submit    = true    # true → qa-form-validation Phase 5 + qa-test-crud submit valid data to verify the success path. Creates real records (cleaned up below).
cleanup_after_submit = true    # if the app exposes a delete/undo for the created record, attempt it after a happy-path submit
safe_routes          = []      # restrict happy-path submit to these routes only (empty = all forms when allow_form_submit = true)

# Parallelism — ONE browser per (engine × viewport), added 2026-06-04.
# The viewport IS the parallelism unit: each engine opens one browser per viewport class, concurrently.
# Total browser windows = (resolved browsers) × (viewport classes). chromium→4, +webkit→8, all three→12.
# qa-preflight generates .mcp.json to match your browser×viewport selection (and asks you to restart).
[parallelism]
headed = true    # browsers visible (the .mcp.json default — no --headless flag). For headless (CI / 12-window pools), ADD "--headless" to each server's args in .mcp.json (or set this false and let preflight regenerate).

# Resilience  (added 2026-06-02 after qa-20260602-005 hang at cell-004)
# These caps prevent a single hanging page from killing the entire audit.
# If a cell exceeds its budget, it is logged as `cellTimeout` and skipped.
[resilience]
navigate_timeout_ms     = 15000   # browser_navigate hard cap
navigate_wait_until     = "domcontentloaded"  # NEVER use "networkidle" — polling SPAs never reach it
post_navigate_settle_ms = 1500    # short settle after domcontentloaded
data_ready_max_ms       = 8000    # extra wait for SPA data fetches (Angular/React/Vue) — caps the
                                  # smart poll that watches for loading-spinner disappearance OR
                                  # rendered rows OR explicit empty-state. Bump to 12000 if your
                                  # app's API is slow; lower to 4000 if data renders fast and you
                                  # want shorter audits. See qa-cell-worker Step 2 "WAIT-FOR-DATA-READY".
evaluate_timeout_ms     = 8000    # browser_evaluate per probe
mcp_call_total_ms       = 20000   # any single MCP call ceiling
cell_total_ms           = 90000   # ENTIRE cell must complete in 90s
cell_max_retries        = 1       # retry failed cell once before giving up
batch_size              = 12      # chunk audit into N-cell Sonnet dispatches (prevents 10-min API timeout)
cells_per_worker        = 8       # MAX cells a single worker Agent call may handle. A (engine×viewport)
                                  # with MORE cells than this is dispatched in SEQUENTIAL WAVES — each wave
                                  # a FRESH Agent call (fresh context). This is the fix for "full-site audit
                                  # drops interactive skills": a worker holding 34 cells runs out of context
                                  # by cell ~10 and silently stops driving the 35 interactive skills (it keeps
                                  # only the cheap one-shot passive probe batch). Capping cells-per-worker
                                  # keeps every worker's context small enough to drive EVERY skill on EVERY
                                  # cell. Lower to 6 on slow/heavy apps; raise to 12 only on tiny sites.
network_capture_cap     = 100     # browser_network_requests() result truncated to this many entries
stream_writes           = true    # write findings JSONL per-skill, not per-cell (prevents data loss on hang)
preflight_url_health    = true    # HEAD baseUrl with 5s timeout before audit starts
coverage_max_retries    = 2       # Step 5.9 finish-gate: re-run missing (cell × skill) pairs up to N times before marking them degraded

# === keep_issuetypes (added 2026-06-09) =============================================
# These skills mix a few REAL defects with cosmetic noise. Instead of disabling them
# wholesale (which lost the real bugs), re-enable them but emit ONLY these issueTypes.
# The deterministic runner (run-passive-probes.cjs) drops every other issueType from them.
[keep_issuetypes]
qa-detect-typography = ["smallFont", "oversizedHeading", "longWordNoBreak"]
qa-detect-images = ["missingAlt", "brokenImage", "imageStretched"]
qa-detect-ux-truncation = ["headerTextTruncatedMidWord", "cellContentTruncatedToCharacter", "buttonTextEllipsised", "tabLabelTruncated"]
qa-detect-ux-actions = ["destructiveNoConfirm"]
qa-detect-ux-pagination = ["paginationNoPageSizeSelector", "paginationPageNumbersOverflow"]
qa-detect-ux-toast-notification = ["toastCloseButtonNoLabel", "statusColorOnlySignal"]
qa-detect-ux-affordance = ["interactiveNoFocusVisible", "hoverOnlyControl"]
qa-detect-ux-required-state = ["requiredFieldErrorOnLoad", "errorClassNoErrorMessage"]
qa-detect-ux-table-data = ["tableColumnAllEmpty", "tableSerialColumnReversed"]
qa-detect-ux-table-layout = ["tableHeaderBodyWidthMismatch", "tableActionsColumnEmpty"]
qa-detect-ux-modal-form = ["modalTitleSingularPluralMismatch", "formStaticTextLooksLikeField"]
qa-detect-ux-icons = ["iconClippedInButton"]

# === drop_issuetypes (added 2026-06-11) ============================================
# DENY-LIST mode (opposite of [keep_issuetypes]). For each skill, list the issueTypes
# you want to drop while keeping everything else from that skill. Useful when a
# normally-good skill emits one or two specific false positives, OR when an issue
# type has migrated to a different skill but stale runs still contain it under the
# old skill name. apply-keep-issuetypes.cjs treats [drop_issuetypes] as the highest
# priority: a (skill, issueType) match here is dropped regardless of [keep_issuetypes].
[drop_issuetypes]
# Migrated 2026-06-11: searchNoClearButton moved from qa-detect-ux-feedback (passive)
# to qa-test-data-controls (interactive, types real keystrokes). Stale runs may still
# carry the old passive emission; the new interactive emission is unaffected.
qa-detect-ux-feedback = ["searchNoClearButton"]

# === Noise sweep 2026-06-15 — drop false positives on Angular Material admin dashboards ===
# These issueTypes flag Material's INTENTIONAL conventions (uppercase chips, status-color
# palette, elevation hierarchy, no zebra striping, touch-action:manipulation, bare :hover,
# :focus-visible pseudo-element rings, translateZ(0) compositing) or apply marketing-site
# rules to an internal admin tool (image srcset, generic CTA copy, homophones on user data),
# or use flat thresholds that ignore data-grid reality (DOM node count, 13-14px table cells,
# table-not-responsive without the overflow wrapper). All real functional/a11y/layout bugs are
# kept. Reversible — delete any line to re-enable that issueType.
qa-detect-touch-interactions    = ["touchEventIgnored", "doubleTapZoomBlocked"]
qa-detect-responsive-images     = ["imageNoSrcset", "imageNoMaxWidth"]
qa-detect-content-patterns      = ["genericCTACopy", "homophoneCandidate"]
qa-detect-typography-responsive = ["bodyTextTooSmallForViewport", "pxFontSizingDominant"]
qa-detect-web-vitals            = ["domNodeCountExcessive"]
qa-detect-reflow                = ["tableNotResponsive"]
qa-detect-adaptive-state        = ["parallaxOnReducedMotion"]
qa-detect-mobile-keyboard       = ["noVisualViewportHandling"]
qa-detect-viewport-units        = ["viewport100vhNotDvh"]
qa-detect-forced-colors         = ["buttonBorderlessWithBg"]
qa-detect-ux-theme-consistency  = ["accentColorMixed"]
qa-detect-ux-card-consistency   = ["cardShadowMixed"]
qa-detect-ux-toolbar-consistency = ["toolbarLabelCasingMixed", "toolbarTextIconButtonStyleMix"]
qa-detect-ux-spacing            = ["formFieldGapInconsistent"]
qa-detect-ux-alignment          = ["iconTextBaselineDrift"]
qa-detect-ux-symmetry           = ["cardRowEdgeMismatch"]
qa-detect-ux-nav-icons          = ["navItemHeightInconsistent"]
qa-detect-ux-selected-color-mix = ["selectedFillVsOutlineMix"]
qa-detect-ux-hover              = ["buttonNoHoverState", "hoverColorOffTheme"]
qa-detect-ux-format-consistency = ["numberFormatMixed"]
qa-detect-ux-media-shape        = ["imageWithoutDimension"]
qa-detect-ux-affordance         = ["interactiveNoFocusVisible"]
